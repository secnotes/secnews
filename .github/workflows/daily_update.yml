name: Daily Security News Update

on:
  schedule:
    # Run daily at 00:07 UTC (Beijing 08:07). Off-peak minute to reduce
    # GitHub Actions scheduling delay/skips (00:00 and round minutes like
    # :10/:15/:30 carry the heaviest global load).
    - cron: '7 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "requirements.txt not found, installing basic packages"
        pip install requests beautifulsoup4 playwright openai python-dotenv
        playwright install chromium

    - name: Create docs directory
      run: |
        mkdir -p docs

    - name: Run scraping script with AI curation
      run: |
        python src/scrape_news.py --unsafe --ai-curate --ai-days 2
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
        AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o-mini' }}
        AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        # Optional X profile proxy (Cloudflare Worker, see x-proxy-worker/README.md).
        # x.com 403s the runner's Azure IP; empty values simply leave these unset
        # and the X scraper falls back to a direct fetch.
        # X_PROXY_BASE is non-sensitive: set it as a Variable (preferred, like
        # AI_MODEL/AI_BASE_URL) or a Secret — either location works.
        X_PROXY_BASE: ${{ vars.X_PROXY_BASE || secrets.X_PROXY_BASE }}
        X_PROXY_TOKEN: ${{ secrets.X_PROXY_TOKEN }}

    - name: Commit and push changes
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        # Check if there are any changes
        if [[ -n $(git status --porcelain) ]]; then
          git add .
          git commit -m "Auto-update security news $(date)"
          git push
        else
          echo "No changes to commit"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}